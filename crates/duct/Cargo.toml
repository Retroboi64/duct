[package]
name = "duct-graphics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/duct-graphics"
keywords.workspace = true
categories.workspace = true
description = "Central router and dynamic pipeline loader for Project32 duct graphics subsystem"
readme = "README.md"

[lib]
name = "duct"
crate-type = ["cdylib", "rlib"]

[dependencies]
duct-core = { package = "duct-graphics-core", path = "../duct-core", version = "0.1.0" }
windowed = { path = "../../../windowed", version = "0.4.0", optional = true }

[features]
default = ["windowed"]
windowed = ["dep:windowed"]
