[package]
name = "duct-graphics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/duct-graphics"
keywords.workspace = true
categories.workspace = true
description = "Central router and dynamic pipeline loader for Project32 duct graphics subsystem"
readme = "README.md"

[lib]
name = "duct"
crate-type = ["cdylib", "rlib"]

[dependencies]
duct-core = { package = "duct-graphics-core", path = "../duct-core", version = "0.1.0" }
windowed = { path = "../../../windowed", version = "0.4.0", optional = true }
glduct = { path = "../glduct", version = "0.1.0", optional = true, default-features = false, features = ["bundled"] }
vkduct = { path = "../vkduct", version = "0.1.0", optional = true, default-features = false, features = ["bundled"] }
dx11duct = { path = "../dx11duct", version = "0.1.0", optional = true, default-features = false, features = ["bundled"] }
dx12duct = { path = "../dx12duct", version = "0.1.0", optional = true, default-features = false, features = ["bundled"] }

[features]
default = ["windowed"]
windowed = ["dep:windowed"]
gl = ["dep:glduct"]
vk = ["dep:vkduct"]
dx11 = ["dep:dx11duct"]
dx12 = ["dep:dx12duct"]
bundled-all = ["gl", "vk", "dx11", "dx12"]
